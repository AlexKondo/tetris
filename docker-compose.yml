services:
  db:
    image: postgres:16-alpine
    container_name: tetris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tetris
      POSTGRES_PASSWORD: tetris
      POSTGRES_DB: tetris
    ports:
      - "5442:5432"
    volumes:
      - tetris_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  tetris_pgdata:
